<!doctype html>
<html lang="es-PE" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Editar perfume')}">
    <title>Editar perfume · Decanly</title>
  </head>
  <body data-route="cuenta" data-page="producto/edit">
    <div th:replace="~{fragments/layout :: cabecera}"></div>
    <div
      id="connection-status"
      class="connection-status"
      role="status"
      hidden=""
    ></div>
    <main id="app" tabindex="-1">
      <section class="section">
        <a class="text-link" href="/producto" th:href="@{/producto}"
          >← Volver al listado</a
        >
        <div class="editor-page panel">
          <div class="modal-content">
            <h2>Editar perfume</h2>
            <form
              id="product-form"
              data-id="1"
              class="form-grid"
              data-api-form="product-form"
              action="#"
              method="post"
            >
              <label class="wide"
                >Nombre<input
                  name="name"
                  class="field"
                  value="Myslf Le Parfum"
                  required=""
                  maxlength="100" /></label
              ><label
                >Marca<input
                  name="brand"
                  class="field"
                  value="Yves Saint Laurent"
                  required=""
                  maxlength="80" /></label
              ><label
                >Ocasión<select name="occasion" class="field">
                  <option>Día</option>
                  <option selected="">Noche</option>
                </select></label
              ><label
                >Precio 3 ml (S/)<input
                  name="price3"
                  class="field"
                  type="number"
                  min="1"
                  max="10000"
                  step="0.01"
                  value="25.35"
                  required="" /></label
              ><label
                >Stock 3 ml<input
                  name="stock3"
                  class="field"
                  type="number"
                  min="0"
                  max="9999"
                  step="1"
                  value="24"
                  required="" /></label
              ><label
                >Precio 5 ml (S/)<input
                  name="price5"
                  class="field"
                  type="number"
                  min="1"
                  max="10000"
                  step="0.01"
                  value="39"
                  required="" /></label
              ><label
                >Stock 5 ml<input
                  name="stock5"
                  class="field"
                  type="number"
                  min="0"
                  max="9999"
                  step="1"
                  value="20"
                  required="" /></label
              ><label
                >Precio 10 ml (S/)<input
                  name="price10"
                  class="field"
                  type="number"
                  min="1"
                  max="10000"
                  step="0.01"
                  value="69"
                  required="" /></label
              ><label
                >Stock 10 ml<input
                  name="stock10"
                  class="field"
                  type="number"
                  min="0"
                  max="9999"
                  step="1"
                  value="12"
                  required="" /></label
              ><label
                >Descuento (%)<input
                  name="discount"
                  class="field"
                  type="number"
                  min="0"
                  max="70"
                  step="1"
                  value="0"
                  required="" /></label
              ><label
                >Foto principal del catálogo (opcional)<input
                  name="photo"
                  class="field"
                  type="file"
                  accept="image/png,image/jpeg,image/webp" /></label
              ><label class="wide"
                >Notas olfativas<input
                  name="notes"
                  class="field"
                  value="Vainilla · Ámbar · Floral blanco · Amaderado · Pimienta"
                  maxlength="300" /></label
              ><button class="btn" type="submit">Guardar producto</button>
              <p class="form-feedback" role="status" aria-live="polite"></p>
            </form>
          </div>
        </div>
      </section>
    </main>
    <div th:replace="~{fragments/layout :: pie}"></div>
  </body>
</html>
