
<!doctype html>
<html lang="es-PE" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Mi cuenta · Decanly</title>

    <link rel="icon"
          th:href="@{/assets/decanly-logo.svg}">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/decanly.css}">
    <link rel="stylesheet" th:href="@{/css/frontend.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/gallery.css}">
    <link rel="stylesheet" th:href="@{/css/fonts.css}">
</head>

<body data-route="cuenta" data-page="cuenta/index">

    <div th:replace="~{fragments/layout :: cabecera}"></div>

    <main id="app" tabindex="-1">

        <section class="page-head">
            <div class="eyebrow">Decanly</div>
            <h1>Tu espacio <em>de gestión.</em></h1>
        </section>

        <section class="panel account">

            <h2>Bienvenido de nuevo</h2>

            <div class="notice">
                Ingresa con tu cuenta de administrador.
            </div>

            <p th:if="${param.loginSuccess}"
               class="form-feedback"
               style="color: green;"
               role="status">
                ¡Inicio de sesión correcto!
            </p>

            <p th:if="${param.error}"
               class="form-feedback error"
               role="alert">
                Correo o contraseña incorrectos.
            </p>

            <p th:if="${param.logout}"
               class="form-feedback"
               role="status">
                Has cerrado sesión correctamente.
            </p>

            <form id="login"
                  method="post"
                  th:action="@{/cuenta/login}">

                <label for="correo">
                    Correo electrónico
                </label>

                <input class="field"
                       id="correo"
                       name="correo"
                       type="email"
                       autocomplete="username"
                       required>

                <label for="clave">
                    Contraseña
                </label>

                <input class="field"
                       id="clave"
                       name="clave"
                       type="password"
                       autocomplete="current-password"
                       required>

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button class="btn" type="submit">
                    Entrar al panel ↗
                </button>
            </form>

            <a class="btn light"
               th:if="${param.loginSuccess}"
               th:href="@{/producto}">
                Ir al panel de administración
            </a>

            <form method="post"
                  th:if="${param.loginSuccess}"
                  th:action="@{/cuenta/logout}">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button class="btn light" type="submit">
                    Cerrar sesión
                </button>
            </form>

        </section>
    </main>

    <div th:replace="~{fragments/layout :: pie}"></div>

</body>
</html>
